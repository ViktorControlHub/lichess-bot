name: Lichess Bot Runner

on:
  push:
    branches: [ master, main ]
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download Stockfish 19 Universal Engine
      run: |
        mkdir -p engines
        # Завантажуємо оригінальний архів Stockfish 19 з офіційних релізів GitHub
        wget https://github.com
        
        # Розпаковуємо його на сервері
        tar -xvf stockfish-19-ubuntu-x86-64.tar
        
        # Переносимо універсальний бінарник у потрібну папку під потрібним ім'ям
        mv stockfish-19/stockfish-19-ubuntu-x86-64 engines/stockfish
        chmod +x engines/stockfish
        
        # Очищуємо зайві тимчасові файли
        rm -rf stockfish-19 stockfish-19-ubuntu-x86-64.tar

    - name: Force Apply Config
      run: |
        cat << 'EOF' > config.yml
        token: "REPLACE_ME"
        url: "https://lichess.org"

        engine:
          name: "stockfish"
          protocol: "uci"
          dir: "./engines"
          options:
            # Налаштування для максимальної потужності безкоштовного сервера GitHub
            Threads: 2
            Hash: 1024
            Ponder: false

        challenge:
          play_bots: true
          play_humans: true
          time_controls:
            - bullet
            - blitz
            - rapid
          modes:
            - casual
            - rated
        EOF

    - name: Run Lichess Bot
      env:
        LICHESS_BOT_TOKEN: ${{ secrets.LICHESS_BOT_TOKEN }}
      run: |
        # Вклеюємо токен і запускаємо
        sed -i "s|REPLACE_ME|$LICHESS_BOT_TOKEN|g" config.yml
        python lichess-bot.py
