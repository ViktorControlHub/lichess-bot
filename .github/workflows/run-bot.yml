name: Lichess Bot Runner

on:
  push:
    branches: [ master, main ]
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Force Apply Config
      run: |
        # Копіюємо наш конфіг під стандартним ім'ям у корінь скрипта
        cp config.yml config.yaml || true

    - name: Run Lichess Bot
      env:
        LICHESS_BOT_TOKEN: ${{ secrets.LICHESS_BOT_TOKEN }}
      run: |
        python lichess-bot.py
