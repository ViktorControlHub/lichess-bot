name: Lichess Bot Runner

on:
  push:
    branches: [ master, main ]
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download Stockfish 19 Engine
      run: |
        mkdir -p engines
        wget https://github.com
        tar -xvf stockfish-ubuntu-x86-64.tar
        mv stockfish/stockfish-ubuntu-x86-64 engines/stockfish
        chmod +x engines/stockfish
        rm -rf stockfish stockfish-ubuntu-x86-64.tar

    - name: Run Lichess Bot
      env:
        LICHESS_BOT_TOKEN: ${{ secrets.LICHESS_BOT_TOKEN }}
      run: |
        python lichess-bot.py

