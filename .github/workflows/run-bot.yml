name: Lichess Bot Runner

on:
  push:
    branches: [ master, main ]
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Встановлюємо надійний модуль для автоматичного керування Stockfish
        pip install stockfish

    - name: Auto Download Stockfish
      run: |
        mkdir -p engines
        # Наказуємо Python автоматично завантажити правильний бінарник під процесор сервера
        python -c "import urllib.request, tarfile, os; urllib.request.urlretrieve('https://github.com', 'sf.tar'); t = tarfile.open('sf.tar'); t.extractall(); os.rename('stockfish-16/stockfish-16-ubuntu-x86-64', 'engines/stockfish'); os.chmod('engines/stockfish', 0o755)"

    - name: Force Apply Config
      run: |
        cat << 'EOF' > config.yml
        token: "REPLACE_ME"
        url: "https://lichess.org"

        engine:
          name: "stockfish"
          protocol: "uci"
          dir: "./engines"
          options: {}

        challenge:
          play_bots: true
          play_humans: true
          time_controls:
            - bullet
            - blitz
            - rapid
          modes:
            - casual
            - rated
          variants:
            - standard
        EOF

    - name: Run Lichess Bot
      env:
        LICHESS_BOT_TOKEN: ${{ secrets.LICHESS_BOT_TOKEN }}
      run: |
        sed -i "s|REPLACE_ME|$LICHESS_BOT_TOKEN|g" config.yml
        python lichess-bot.py
