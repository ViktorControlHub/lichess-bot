name: Lichess Bot Runner

on:
  push:
    branches: [ master, main ]
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Force Apply Config
      run: |
        cat << 'EOF' > config.yml
        token: "REPLACE_ME"
        url: "https://lichess.org"

        engine:
          name: "stockfish"
          protocol: "uci"
          # Вказуємо пряму системну папку GitHub, де вже лежить готовий Stockfish
          dir: "/usr/games"
          options: {}

        challenge:
          play_bots: true
          play_humans: true
          time_controls:
            - bullet
            - blitz
            - rapid
          modes:
            - casual
            - rated
          variants:
            - standard
        EOF

    - name: Run Lichess Bot
      env:
        LICHESS_BOT_TOKEN: ${{ secrets.LICHESS_BOT_TOKEN }}
      run: |
        sed -i "s|REPLACE_ME|$LICHESS_BOT_TOKEN|g" config.yml
        python lichess-bot.py
