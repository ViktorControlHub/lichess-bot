name: Lichess Bot Runner

on:
  push:
    branches: [ master, main ]
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Force Apply Config
      run: |
        # Записуємо налаштування примусово у файл, який бот точно прочитає
        cat << 'EOF' > config.yml
        token: "$LICHESS_BOT_TOKEN"
        url: "https://lichess.org"

        engine:
          name: "stockfish"
          protocol: "uci"
          dir: "./engines"
          options:
            Threads: 2
            Hash: 1024
            Ponder: false
            Skill Level: 20

        challenge:
          play_bots: true
          play_humans: true
          time_controls:
            - bullet
            - blitz
            - rapid
          modes:
            - casual
            - rated
        EOF

    - name: Run Lichess Bot
      env:
        LICHESS_BOT_TOKEN: ${{ secrets.LICHESS_BOT_TOKEN }}
      run: |
        python lichess-bot.py
