name: Lichess Bot Runner

on:
  push:
    branches: [ master, main ]
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Stockfish 19 from Source
      run: |
        mkdir -p engines
        # Завантажуємо офіційний вихідний код найсвіжішої версії Stockfish 19
        git clone --depth 1 https://github.com stockfish_src
        cd stockfish_src/src
        
        # Компілюємо рушій безпосередньо на сервері під його рідний процесор
        make -j2 profile-build ARCH=x86-64
        
        # Переносимо готовий непереможний бінарник у папку бота
        mv stockfish ../../engines/stockfish
        cd ../../
        rm -rf stockfish_src
        chmod +x engines/stockfish

    - name: Force Apply Config
      run: |
        cat << 'EOF' > config.yml
        token: "REPLACE_ME"
        url: "https://lichess.org"

        engine:
          name: "stockfish"
          protocol: "uci"
          dir: "./engines"
          options:
            Threads: 2
            Hash: 1024
            Ponder: false

        challenge:
          play_bots: true
          play_humans: true
          time_controls:
            - bullet
            - blitz
            - rapid
          modes:
            - casual
            - rated
        EOF

    - name: Run Lichess Bot
      env:
        LICHESS_BOT_TOKEN: ${{ secrets.LICHESS_BOT_TOKEN }}
      run: |
        sed -i "s|REPLACE_ME|$LICHESS_BOT_TOKEN|g" config.yml
        python lichess-bot.py
